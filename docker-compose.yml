version: '3.8'

services:
  # Zep - Memory Management for AI Agents
  zep:
    image: ghcr.io/getzep/zep:latest
    container_name: obsei-zep
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ZEP_STORE_TYPE=postgres
      - ZEP_STORE_POSTGRES_DSN=postgres://zep_user:zep_password@postgres:5432/zep?sslmode=disable
      - ZEP_AUTH_REQUIRED=false
      - ZEP_SERVER_PORT=8000
      - ZEP_LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - obsei-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - Database for Zep
  postgres:
    image: postgres:15-alpine
    container_name: obsei-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=zep_user
      - POSTGRES_PASSWORD=zep_password
      - POSTGRES_DB=zep
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - obsei-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zep_user -d zep"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant - Vector Database for Mem0
  qdrant:
    image: qdrant/qdrant:latest
    container_name: obsei-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - obsei-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  obsei-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  qdrant-data:
    driver: local
